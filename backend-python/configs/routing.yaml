# Semantic routing candidate pool for `openrouter/auto` (DRD §9.1, RT-002).
#
# When a client sends `model: "openrouter/auto"`, the gateway delegates to
# the Python RoutingService.ResolveModel RPC. The servicer:
#   1. Loads this file (cached in-process; reload via SIGHUP — Phase 2 wiring)
#   2. Filters `pool` entries by RequestHints (needs_tools, needs_vision,
#      needs_streaming, user_geo, data_residency_jurisdictions)
#   3. Hands surviving Candidates to the StrategyRegistry strategy named in
#      `default_strategy` (or per-key override)
#   4. Returns ResolveModelResponse(primary, fallback, strategy_used)
#
# Quality scores: 0..1. Sourced from Auto Exacto evals (DRD §9.2). Update
# alongside model_pricing rows. Latency p50 in milliseconds.

default_strategy: cost           # cost | latency | quality
fallback_max: 2                  # number of fallback candidates returned

pool:
  # ---------- OpenAI ----------
  - model: gpt-4o
    provider: openai
    pricing_per_million: 2.50
    quality_score: 0.92
    latency_p50_ms: 850
    capabilities: [text, vision, tools, streaming]
    geos_allowed: ["*"]
    residency: [us, eu, global]

  - model: gpt-4o-mini
    provider: openai
    pricing_per_million: 0.15
    quality_score: 0.78
    latency_p50_ms: 420
    capabilities: [text, vision, tools, streaming]
    geos_allowed: ["*"]
    residency: [us, eu, global]

  # ---------- Anthropic ----------
