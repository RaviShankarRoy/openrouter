# Per-strategy hard floors. If no candidate clears the floor, the request
# falls back to OpenAI gpt-4o-mini (sentinel, never filtered out).
strategy_floors:
  quality: 0.70                  # cost-strategy may pick cheaper; quality must clear this
  latency_max_ms: 5000
