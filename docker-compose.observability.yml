# Observability stack for local development.
# Run alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Configs are mounted from infrastructure/observability/ — production picks
# the same files up via Helm chart values.

name: openrouter-observability

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: or-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheusdata:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: or-alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  loki:
    image: grafana/loki:3.2.0
    container_name: or-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki

  promtail:
    image: grafana/promtail:3.2.0
    container_name: or-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./infrastructure/observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  tempo:
    image: grafana/tempo:2.6.0
    container_name: or-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"   # HTTP
      - "4317:4317"   # OTLP gRPC (replaces jaeger's 4317 — disable jaeger if conflict)
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./infrastructure/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo

  grafana:
    image: grafana/grafana:11.3.0
    container_name: or-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: dev_only_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - "3001:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]

volumes:
  prometheusdata:
  lokidata:
  tempodata:
  grafanadata:
