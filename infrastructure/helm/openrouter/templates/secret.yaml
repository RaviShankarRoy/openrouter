{{- /*
Secret manifests are generated only when externalSecrets.enabled=false (i.e.
the chart is installed without the operator). For real installs, the secrets
come from Vault via ExternalSecret CRs created out-of-band.
WHY this guard: chart-as-source-of-truth for secrets is an anti-pattern.
*/ -}}
{{- if not .Values.global.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-app
  labels:
    {{- include "openrouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  # TODO: replace with `--set secret.appKey=...` at install time.
  secret_key: "REPLACE_ME_AT_INSTALL_TIME_min_32_chars_long"
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-postgres
  labels:
    {{- include "openrouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ default "postgresql+asyncpg://openrouter:dev_only_password@postgres:5432/openrouter" .Values.postgres.dsn | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-redis
  labels:
    {{- include "openrouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ default "redis://redis:6379/0" .Values.redis.url | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-nats
  labels:
    {{- include "openrouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: "nats://nats:4222"
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-frontend
  labels:
    {{- include "openrouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  nextauth_secret: "REPLACE_ME_AT_INSTALL_TIME"
{{- end }}
