{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openrouter.serviceAccountName" (dict "ctx" . "component" "gateway") }}
  labels:
    {{- include "openrouter.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openrouter.serviceAccountName" (dict "ctx" . "component" "backend") }}
  labels:
    {{- include "openrouter.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
