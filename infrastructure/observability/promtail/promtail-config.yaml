# Promtail tails container stdout/stderr and ships JSON-line logs to Loki.
# All four services emit structured JSON per ARCHITECTURE.md §2.2 — extracted
# fields become Loki labels (bounded set: service, level, env).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets: [localhost]
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
      - json:
          source: attrs
          expressions:
            tag: tag
      - regex:
          source: tag
          expression: '^(?P<container_name>(?:[^|]+))\|(?P<image_name>(?:[^|]+))$'
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
          container_name:
      - output:
          source: output
      # Parse the service's own JSON envelope to surface level + service.
      - json:
          expressions:
            level: level
            service: service
            trace_id: trace_id
      - labels:
          level:
          service:
