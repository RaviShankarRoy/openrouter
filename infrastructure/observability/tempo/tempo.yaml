# Single-binary Tempo for dev/staging. Production runs the distributed chart
# with S3-backed object storage and Memberlist gossip.
#
# Receivers: OTLP gRPC + HTTP (W3C Trace Context). All four services emit OTLP
# per ARCHITECTURE.md §2.4.

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
  flush_op_timeout: 60s
  flush_check_period: 10s

compactor:
  compaction:
    block_retention: 168h           # 7 days in dev; prod overrides to 30d
    compacted_block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 100
      queue_depth: 10000

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      max_items: 10000
    span_metrics: {}

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
