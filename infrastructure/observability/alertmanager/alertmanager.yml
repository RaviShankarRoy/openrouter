# Alertmanager routing — page severity to PagerDuty, ticket severity to Slack,
# info severity to a low-noise digest channel. Production overrides via
# Helm values; this is the dev/staging shape.

global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}"

route:
  receiver: default-slack
  group_by: ["alertname", "severity", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity = "page"]
      receiver: pagerduty
      group_wait: 0s
      continue: true  # also notify slack so the team has context
    - matchers: [severity = "page"]
      receiver: slack-ops
    - matchers: [severity = "ticket"]
      receiver: slack-ops
    - matchers: [severity = "info"]
      receiver: slack-digest

receivers:
  - name: default-slack
    slack_configs:
      - channel: "#alerts-default"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }}"

  - name: slack-ops
    slack_configs:
      - channel: "#alerts-ops"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: |
          *Severity:* {{ .CommonLabels.severity }}
          *Team:* {{ .CommonLabels.team }}
          *Summary:* {{ .CommonAnnotations.summary }}
          {{ if .CommonAnnotations.runbook }}*Runbook:* {{ .CommonAnnotations.runbook }}{{ end }}

  - name: slack-digest
    slack_configs:
      - channel: "#alerts-digest"
        send_resolved: false

  - name: pagerduty
    pagerduty_configs:
      - service_key: "${PAGERDUTY_SERVICE_KEY}"
        description: "{{ .CommonLabels.alertname }} — {{ .CommonAnnotations.summary }}"
        severity: critical

inhibit_rules:
  # When a target is down, suppress derivative alerts that depend on its metrics.
  - source_matchers: [alertname = TargetDown]
    target_matchers: [severity =~ "page|ticket"]
    equal: ["instance"]
