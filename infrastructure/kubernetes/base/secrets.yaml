---
# Provider keys. Bulk-loaded; the backend reads these into its provider registry
# at startup (DRD §7.2 adapter pattern). TODO: per-provider rotation policy.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openrouter-providers
  labels:
    app.kubernetes.io/part-of: openrouter
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: openrouter-providers
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: data/openrouter/providers
