# External Secrets bindings — values pulled from Vault (DRD SE-003).
# WHY ExternalSecret over a checked-in Secret: secret material never lives in
# the manifest repo. The CSO and the platform team can rotate in Vault without
# a redeploy.
#
# Requires: external-secrets.io operator + a SecretStore named 'vault-backend'.
# scripts/k8s-bootstrap.sh installs the operator and creates the SecretStore.
#
# All secrets in this file resolve to k8s Secrets in the 'openrouter' namespace
# under the names referenced from each Deployment.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/part-of: openrouter
spec:
  provider:
    vault:
      # Per-environment overlay should patch this server URL.
      server: "https://vault.openrouter.internal"
      path: "openrouter"
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: openrouter-platform
          serviceAccountRef:
            name: backend-python
---
# Postgres DSN. In prod this points at RDS; in dev/staging the Patroni cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openrouter-postgres
  labels:
    app.kubernetes.io/part-of: openrouter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: openrouter-postgres
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: data/openrouter/postgres
        property: dsn
