apiVersion: v1
kind: Service
metadata:
  name: frontend-web
  labels:
    app.kubernetes.io/name: frontend-web
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
