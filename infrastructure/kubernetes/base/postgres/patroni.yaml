# Self-hosted Postgres for the in-cluster variant (DRD IN-009 self-hosted).
# WHY Patroni over the operator's own HA: Patroni + etcd is the smallest
# proven HA topology that gives us automatic failover with WAL streaming.
# RTO ~30s with the right etcd placement (NFR-007 < 5min).
#
# Production with managed Postgres skips this StatefulSet via the prod overlay
# patch (it removes postgres/* and the associated NetworkPolicy / Service).
#
# pgvector extension installed in the init script (infrastructure/postgres/init.sql).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None  # headless for StatefulSet pod DNS
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: patroni
      port: 8008
      targetPort: 8008
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  # 3 replicas: primary + 2 sync replicas. Patroni elects on failover.
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          # WHY pgvector in the image: avoids a separate init container for the extension.
          image: ghcr.io/zalando/spilo-16:3.2-p1
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
            - name: patroni
              containerPort: 8008
          env:
            - name: PGUSER_SUPERUSER
              value: postgres
            - name: PGPASSWORD_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: openrouter-postgres-bootstrap
                  key: superuser_password
            - name: PGUSER_REPLICATION
              value: standby
            - name: PGPASSWORD_REPLICATION
              valueFrom:
                secretKeyRef:
                  name: openrouter-postgres-bootstrap
                  key: replication_password
            - name: SCOPE
              value: openrouter
            - name: PGROOT
              value: /home/postgres/pgdata
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /liveness
              port: patroni
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readiness
              port: patroni
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            # WHY rwroot=false here (only place): Postgres needs to write to
            # config dirs at startup. We compensate with capability dropping.
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pgdata
              mountPath: /home/postgres/pgdata
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            # Per-pod data volume. Production overlay raises this and pins a
            # storageClassName (gp3 / pd-ssd). Keep small in base for dev.
            storage: 50Gi
