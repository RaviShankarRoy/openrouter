# Dedicated SA so we can scope IRSA / RBAC / NetworkPolicy targeting.
# The gateway needs zero Kubernetes API access at runtime — automountServiceAccountToken
# is therefore disabled at the pod template level (defence-in-depth even though
# this SA holds no permissions).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-go
  labels:
    app.kubernetes.io/name: gateway-go
    app.kubernetes.io/component: gateway
  annotations:
    # IRSA hook for AWS deployments; the role provides access to Secrets Manager
    # and S3 (audit log spool). The actual ARN is patched per-environment overlay.
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/openrouter-gateway-go
    description: "Gateway hot-path workload identity (DRD GW-001)."
automountServiceAccountToken: false
