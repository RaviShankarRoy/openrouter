# Backend SA. Holds IRSA bindings for:
#   - Secrets Manager: provider keys, Stripe, OAuth client secrets (DRD SE-003)
#   - S3: media bucket read/write (DRD §22.3 object storage)
#   - SES/SNS: optional notification channels
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-python
  labels:
    app.kubernetes.io/name: backend-python
    app.kubernetes.io/component: backend
  annotations:
    description: "FastAPI backend workload identity (DRD PY-* requirements)."
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/openrouter-backend-python
automountServiceAccountToken: false
