# LOCAL ONLY. Plain Secrets so minikube does not need Vault + external-secrets.
# Values are deliberately weak and public — never reuse them anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-postgres
type: Opaque
stringData:
  dsn: postgresql+asyncpg://openrouter:dev_only_password@postgres:5432/openrouter
  username: openrouter
  password: dev_only_password
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-redis
type: Opaque
stringData:
  url: redis://redis:6379/0
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-nats
type: Opaque
stringData:
  url: nats://nats:4222
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-app
type: Opaque
stringData:
  secret_key: minikube_only_secret_key_at_least_32_chars_long
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-stripe
type: Opaque
stringData:
  api_key: sk_test_not_a_real_key
  webhook_secret: whsec_not_a_real_secret
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-frontend
type: Opaque
stringData:
  nextauth_secret: minikube_only_nextauth_secret_32_chars
