# Staging — prod-like topology, smaller scale (2-AZ, half the ceilings).
# WHY a separate environment vs prod-with-flags: lets us validate Helm/Kustomize
# changes against real managed services (RDS, ElastiCache) before prod blast radius.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openrouter-staging

namePrefix: staging-

commonLabels:
  app.kubernetes.io/instance: openrouter-staging
  environment: staging

resources:
  - ../../base

images:
  - name: ghcr.io/openrouter/gateway-go
    newTag: staging
  - name: ghcr.io/openrouter/backend-python
    newTag: staging
  - name: ghcr.io/openrouter/frontend-web
    newTag: staging

patches:
  - path: patches/replicas.yaml
  - path: patches/ingress-host.yaml

configMapGenerator:
  - name: openrouter-env
    behavior: create
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=info
      - NEXT_PUBLIC_API_BASE_URL=https://api.staging.openrouter.example
      - NEXTAUTH_URL=https://app.staging.openrouter.example
