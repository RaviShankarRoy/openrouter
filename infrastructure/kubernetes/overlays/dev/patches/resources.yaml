# Dev = looser resource floors so a laptop can host the whole stack.
# Limits are intentionally generous to avoid noisy OOMKills during exploration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-go
spec:
  template:
    spec:
      containers:
        - name: gateway
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-python
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-celery-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
spec:
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
