# Provider routing configuration. Hot-reloadable on SIGHUP (DRD GW-015).
#
# `endpoints` are the actual upstream URLs for each provider. The `key_env` value
# names the env var holding the API key — the gateway never reads keys from this file.

providers:
  openai:
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    timeout_seconds: 120
    max_idle_conns: 100
    max_conns_per_host: 50
    circuit_breaker:
      max_failures: 5
      reset_timeout_seconds: 30
    rate_limit:
      requests_per_minute: 5000

  anthropic:
    base_url: https://api.anthropic.com/v1
    key_env: ANTHROPIC_API_KEY
    timeout_seconds: 120
    max_idle_conns: 100
    max_conns_per_host: 50
    circuit_breaker:
      max_failures: 5
      reset_timeout_seconds: 30
    headers:
      anthropic-version: "2023-06-01"

  google:
    base_url: https://generativelanguage.googleapis.com/v1beta
    key_env: GOOGLE_API_KEY
    timeout_seconds: 120

  # OpenAI-compatible aggregators — reuse the OpenAI passthrough adapter.
  together:
    base_url: https://api.together.xyz/v1
    key_env: TOGETHER_API_KEY
    timeout_seconds: 120
    max_idle_conns: 100
    max_conns_per_host: 50
    circuit_breaker:
      max_failures: 5
      reset_timeout_seconds: 30

  fireworks:
    base_url: https://api.fireworks.ai/inference/v1
    key_env: FIREWORKS_API_KEY
    timeout_seconds: 120
    max_idle_conns: 100
    max_conns_per_host: 50
    circuit_breaker:
      max_failures: 5
      reset_timeout_seconds: 30

  # Self-host (optional). Leave OLLAMA_API_KEY empty; Ollama ignores auth.
  ollama:
    base_url: http://ollama:11434/v1
    key_env: OLLAMA_API_KEY
    timeout_seconds: 600
    max_idle_conns: 20
    max_conns_per_host: 10

models:
  # Each model has a primary provider + ordered fallback chain.
  # Routing strategy from key policy may override selection at request time.
  - id: gpt-4o
    provider: openai
    fallback: []
  - id: gpt-4o-mini
    provider: openai
    fallback: []
  - id: anthropic/claude-sonnet-4-20250514
    provider: anthropic
    fallback:
      - { provider: openai, model: gpt-4o }
  - id: anthropic/claude-opus-4-20250514
    provider: anthropic
    fallback:
      - { provider: openai, model: gpt-4o }
  - id: google/gemini-1.5-pro
    provider: google
    fallback: []

  # Gemma 4 (April 2026, Apache 2.0). Apache 2.0 license.
  - id: google/gemma-4-31b
    provider: fireworks
    fallback:
      - { provider: together, model: google/gemma-4-31b-instruct }
  - id: google/gemma-4-26b-moe
    provider: fireworks
    fallback:
      - { provider: together, model: google/gemma-4-26b-moe }
  - id: google/gemma-4-e4b
    provider: ollama
    fallback:
      - { provider: fireworks, model: accounts/fireworks/models/gemma-4-e4b }
  - id: google/gemma-4-e2b
    provider: ollama
    fallback: []

  # Qwen 3.x (2026, Apache 2.0).
  - id: qwen/qwen3.6-27b
    provider: together
    fallback:
      - { provider: fireworks, model: accounts/fireworks/models/qwen3p6-27b }
  - id: qwen/qwen3.6-35b-a3b
    provider: together
    fallback:
      - { provider: fireworks, model: accounts/fireworks/models/qwen3p6-35b-a3b }
  - id: qwen/qwen3.5-35b-a3b
    provider: together
    fallback:
      - { provider: fireworks, model: accounts/fireworks/models/qwen3p5-35b-a3b }
  - id: qwen/qwen3.5-122b-a10b
    provider: fireworks
    fallback:
      - { provider: together, model: Qwen/Qwen3.5-122B-A10B-Instruct }
